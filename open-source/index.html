<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keiko Buoy</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Keiko</h1>
  </header>

  <main>
    <section class="panel map-panel">
      <h2>Live map</h2>
      <div id="map"></div>
    </section>

    <section class="panel">
      <h2>Buoy status</h2>
      <table class="status">
        <tr><th>ID</th><td id="s-id">—</td></tr>
        <tr><th>State</th><td id="s-state">—</td></tr>
        <tr><th>Position</th><td id="s-pos">—</td></tr>
        <tr><th>Last update</th><td id="s-time">—</td></tr>
      </table>
    </section>

    <section class="panel hydro-panel">
      <h2>Live hydrophone</h2>
      <p class="label">Mel spectrogram, 0–1 kHz, last 30 s</p>
      <canvas id="spec" width="600" height="160"></canvas>
      <p class="label" id="spec-note">Level: — dB</p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="synthetic.js"></script>
  <script src="app.js"></script>
</body>
</html>
