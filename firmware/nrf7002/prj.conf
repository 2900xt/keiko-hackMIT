# Keiko nRF7002 node — build configuration. Site settings (Wi-Fi, UDP target, node id) are in keiko.conf.

# --- sampler --------------------------------------------------------------------------------
CONFIG_ADC=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768        # one tick per RTC cycle so KEIKO_SAMPLE_PERIOD_TICKS is exact
CONFIG_TIMESLICING=n
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y                # the health line prints floats
CONFIG_GPIO=y

# --- Wi-Fi (nRF7002 companion over SPI; the board files bring the device tree node) ---------
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NRF_WIFI_LOW_POWER=n                 # no power save: the stream is continuous anyway

# --- IP stack -------------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_DNS_RESOLVER=y                       # only used when KEIKO_UDP_HOST is a name
CONFIG_NET_LOG=y

# buffers/stacks the nRF70 driver + net stack need (from nrf/samples/wifi/sta)
CONFIG_HEAP_MEM_POOL_SIZE=153600
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# --- console: 115200 on the DK's first J-Link VCOM ----------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
