# Keiko nRF7002 node settings — the counterpart of firmware/unoq/python/keiko.env.
# Baked into the image at build time (`make build` passes this file as EXTRA_CONF_FILE), so
# edit, then `make flash`. Override one-off from the command line: make build UDP_HOST=10.0.0.5

# Wi-Fi the node joins (2.4 or 5 GHz; a phone hotspot is the safest at a venue -- see README)
CONFIG_KEIKO_WIFI_SSID="keiko"
CONFIG_KEIKO_WIFI_PSK="changeme"

# Where the UDP block stream goes:
#   255.255.255.255   every machine on the subnet -- a pipeline on any laptop or the UNO Q gets it
#   192.168.x.y       one laptop running the pipeline
CONFIG_KEIKO_UDP_HOST="255.255.255.255"
CONFIG_KEIKO_UDP_PORT=5005
CONFIG_KEIKO_NODE_ID=1

# 4 RTC ticks = 8192 Hz (Nyquist 4 kHz). 10 = 3277 Hz to match the UNO Q node exactly.
CONFIG_KEIKO_SAMPLE_PERIOD_TICKS=4
